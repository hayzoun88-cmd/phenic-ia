<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message envoyé — PHENICIA</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      color: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      border: 2px solid #d6b36a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 32px; height: 32px; }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      color: #b7b7b7;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid #d6b36a;
      color: #d6b36a;
      text-decoration: none;
      border-radius: 6px;
      transition: background .2s, color .2s;
      font-size: .95rem;
    }
    a.btn:hover {
      background: #d6b36a;
      color: #080808;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d6b36a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Votre message a bien été envoyé</h1>
    <p>Merci pour votre message. Notre équipe vous répondra sous 24h ouvrées.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
